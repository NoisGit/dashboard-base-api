# Alembic configuration file for Sentinel Enterprise API
# This file is read by alembic/env.py, which can override sqlalchemy.url
# using the central Settings (src.config.config).

[alembic]
# Path to migration scripts (relative to project root)
script_location = migration

# Template used to generate migration file names
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# Use os.pathsep for splitting multiple paths
path_separator = os

# The output encoding used when revision files are written
# output_encoding = utf-8

# ---------------------------------------------------------------------------
# DATABASE URL
# ---------------------------------------------------------------------------
# This value is a placeholder and WILL be overridden in alembic/env.py
# by src.config.config.get_settings().database_url.
#
# You do NOT need a real database here yet; it's only a fallback.
sqlalchemy.url = postgresql+asyncpg://user:password@localhost:5432/dbname


[post_write_hooks]
# You can enable formatters/linters on generated migrations here if needed.
# Example for black:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME


# ---------------------------------------------------------------------------
# Logging configuration
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
