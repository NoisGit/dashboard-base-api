<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Expirado</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #1f2937;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 90%;
            width: 350px;
        }

        .icon-box {
            background-color: #fee2e2;
            color: #991b1b;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem auto;
            font-size: 30px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        p {
            color: #6b7280;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .footer {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 1rem;
            border-top: 1px solid #e5e7eb;
            padding-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon-box">🔒</div>
        <h1>Enlace Expirado</h1>
        <p>
            Por motivos de seguridad, este código de acceso temporal ha caducado o no es válido.
        </p>
        <p style="font-weight: 500; color: #374151;">
            Por favor, solicite a un operador autorizado generar un nuevo código QR.
        </p>
        <div class="footer">
            Plataforma Coredeck
        </div>
    </div>
</body>

</html>
