<!doctype html>
<html lang="es">
  <body style="margin:0;background:#f4f7f6;font-family:Arial,sans-serif;color:#17332f">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr><td align="center" style="padding:32px 16px">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fff;border-radius:18px;overflow:hidden">
          <tr><td style="background:#0b4f48;color:#fff;padding:28px 32px;font-size:24px;font-weight:700">Locentr</td></tr>
          <tr><td style="padding:32px">
            <h1 style="margin:0 0 16px;font-size:24px">{{ title }}</h1>
            <p style="margin:0 0 24px;line-height:1.6;color:#4b635f">{{ message }}</p>
            {% if action_url %}
            <a href="{{ action_url }}" style="display:inline-block;background:#18a88b;color:#fff;text-decoration:none;padding:12px 20px;border-radius:10px;font-weight:700">{{ action_label }}</a>
            {% endif %}
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
