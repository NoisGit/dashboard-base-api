name: Fix blacklist audit findings

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply blacklist fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/services/blacklist_service.py')
          text = path.read_text(encoding='utf-8')

          if 'from src.core.enums import UserRole' not in text:
              text = text.replace(
                  'from sqlmodel import desc, or_, select\n\nfrom src.models import (',
                  'from sqlmodel import desc, or_, select\n\nfrom src.core.enums import UserRole\nfrom src.models import ('
              )

          text = text.replace(
              '                user_id=user_id,\n                location_id=location_id,\n                payload=payload,',
              '                user_id=user_id,\n                location_id=location_id,\n                company_id=None,\n                payload=payload,'
          )

          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/fix-blacklist-audit-findings.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit fixes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/services/blacklist_service.py .github/workflows/fix-blacklist-audit-findings.yml
            git commit -m "Fix blacklist audit findings"
            git push
          fi
