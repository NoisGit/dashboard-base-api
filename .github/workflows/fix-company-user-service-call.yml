name: Fix company user service call

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix service call
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/services/company_service.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'check_user = await self.get_user_by_email(payload.email)',
              'check_user = await self.user_service.get_user_by_email(payload.email)',
          )
          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/fix-company-user-service-call.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit fix
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/services/company_service.py .github/workflows/fix-company-user-service-call.yml
            git commit -m "Fix company user service call"
            git push
          fi
