name: Temporary Location Service Patch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch location service
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/services/location_service.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'from src.services import UserService, CompanyService, StorageService',
              'from src.services.user_service import UserService\nfrom src.services.company_service import CompanyService\nfrom src.services.storage_service import StorageService',
          )
          text = text.replace('blob_name=location.logo', 'object_name=location.logo')

          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/temporary-location-service-patch.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit patch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/services/location_service.py .github/workflows/temporary-location-service-patch.yml
            git commit -m "Patch location service storage parameter"
            git push
          fi
