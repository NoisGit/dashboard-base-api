name: Fix location operator route parameter

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix parameter order
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routers/locations.py')
          text = path.read_text(encoding='utf-8')
          old = '''async def list_operators(
    params: Params = Depends(),
    location_id: int = None,'''
          new = '''async def list_operators(
    location_id: int,
    params: Params = Depends(),'''
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/fix-location-operator-param.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit fix
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/routers/locations.py .github/workflows/fix-location-operator-param.yml
            git commit -m "Fix location operator route parameter"
            git push
          fi
