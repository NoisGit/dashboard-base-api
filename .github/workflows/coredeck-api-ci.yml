name: Coredeck API CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql+asyncpg://coredeck:coredeck@localhost:5432/coredeck_test
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ENV: test
      DEBUG: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall src

      - name: Run tests
        run: pytest
