name: Cleanup legacy storage names

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace legacy storage names
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'AzureService': 'StorageService',
              'azure_service': 'storage_service',
              'generate_sas_upload_url': 'generate_upload_url',
              'generate_sas_update_url': 'generate_update_url',
              'generate_delete_sas_url': 'generate_delete_url',
              'generate_read_sas_url': 'generate_read_url',
              'src.services.azure_service': 'src.services.storage_service',
          }

          for path in Path('src').rglob('*.py'):
              text = path.read_text(encoding='utf-8')
              new_text = text
              for old, new in replacements.items():
                  new_text = new_text.replace(old, new)
              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')

          workflow = Path('.github/workflows/cleanup-legacy-storage-names.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit cleanup
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src .github/workflows/cleanup-legacy-storage-names.yml
            git commit -m "Remove legacy storage names"
            git push
          fi
