name: Dead Code Audit

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run dead code audit
        shell: bash
        run: |
          mkdir -p ci_diagnostics
          {
            echo "## ruff unused imports and variables"
            python -m pip install --upgrade pip
            pip install ruff vulture
            ruff check src tests scripts --select F401,F841,F821,F811 --output-format=concise || true
            echo ""
            echo "## vulture high confidence candidates"
            vulture src tests scripts --min-confidence 80 || true
          } > ci_diagnostics/dead_code_report.txt 2>&1

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci_diagnostics/dead_code_report.txt
          git commit -m "Add latest dead code audit report" || true
          git push || true
