name: Coredeck CI Diagnostics

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    env:
      DATABASE_URL: postgresql+asyncpg://localhost/coredeck_test
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ENV: test
      DEBUG: false
      SUPABASE_STORAGE_BUCKET: coredeck
      SUPABASE_URL: http://localhost:54321
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run diagnostics
        shell: bash
        run: |
          mkdir -p ci_diagnostics
          {
            echo "## python"
            python --version
            echo "## install"
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            echo "## compile"
            python -m compileall src
            echo "## pytest"
            pytest -q
          } > ci_diagnostics/latest.txt 2>&1 || true

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci_diagnostics/latest.txt
          git commit -m "Add latest CI diagnostics" || true
          git push || true
