name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coredeck
          POSTGRES_PASSWORD: coredeck
          POSTGRES_DB: coredeck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENV: test
      SECRET_KEY: test-secret-key
      DATABASE_URL: postgresql+asyncpg://coredeck:coredeck@localhost:5432/coredeck_test
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_STORAGE_BUCKET: coredeck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Compile source
        run: python -m compileall src tests

      - name: Run critical lint checks
        run: ruff check src tests --select F401,F821,F841,F811

      - name: Run tests
        run: pytest
