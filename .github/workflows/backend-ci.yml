name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: locentr
          POSTGRES_PASSWORD: locentr
          POSTGRES_DB: locentr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENV: test
      SECRET_KEY: test-secret-key
      DATABASE_URL: postgresql+asyncpg://locentr:locentr@localhost:5432/locentr_test
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_STORAGE_BUCKET: locentr

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile source
        run: python -m compileall src tests

      - name: Run critical lint checks
        run: ruff check src tests --select F401,F821,F841,F811

      - name: Check installed dependencies
        run: pip check

      - name: Run static security checks
        run: bandit -q -r src -x tests

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

      - name: Check dependency usage
        run: deptry .

      - name: Check high-confidence dead code
        run: vulture src tests --min-confidence 90

      - name: Run tests
        run: pytest
