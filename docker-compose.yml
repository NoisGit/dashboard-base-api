services:
  coredeck-db:
    image: postgres:17.6
    container_name: coredeck_db
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coredeck_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coredeck_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-coredeck_db}
    volumes:
      - ./postgres:/var/lib/postgresql/data

  coredeck-pgadmin:
    image: dpage/pgadmin4
    container_name: coredeck_pgadmin
    restart: always
    depends_on:
      - coredeck-db
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me-local}
    volumes:
      - ./pgadmin:/var/lib/pgadmin
