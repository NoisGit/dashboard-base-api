services:
  locentr-db:
    image: postgres:17.6
    container_name: locentr_db
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-locentr_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-locentr_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-locentr_db}
    volumes:
      - locentr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-locentr_admin} -d ${POSTGRES_DB:-locentr_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  locentr-pgadmin:
    image: dpage/pgadmin4
    container_name: locentr_pgadmin
    restart: always
    depends_on:
      locentr-db:
        condition: service_healthy
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@nois.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-locentr_pgadmin_local}
    volumes:
      - locentr_pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  locentr_postgres_data:
    name: locentr_postgres_data
  locentr_pgadmin_data:
    name: locentr_pgadmin_data
